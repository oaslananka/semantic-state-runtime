name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'oaslananka/semantic-state-runtime' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare version PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN-created PRs do not produce ordinary push CI runs.
      # workflow_dispatch is exempt from this suppression and runs on the PR head.
      - name: Run required CI for the Release Please PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(node --input-type=module -e '
            const pr = JSON.parse(process.env.RELEASE_PR_JSON);
            const name = pr?.headBranchName;
            if (typeof name !== "string" || !name.startsWith("release-please--branches--main--")) {
              throw new Error("Unexpected Release Please branch name");
            }
            process.stdout.write(name);
          ')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

      - name: Dispatch npm for the new GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field version="$VERSION" --field tag="$TAG"
